version: "3.9"

volumes:
  pgdata:
  redisdata:

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: instram
      POSTGRES_PASSWORD: instram_dev
      POSTGRES_DB: instram_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instram"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://instram:instram_dev@postgres:5432/instram_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change_me_access_docker_dev
      JWT_REFRESH_SECRET: change_me_refresh_docker_dev
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      PORT: "4000"
      NODE_ENV: development
      SMS_PROVIDER: stub
      MVOLA_BASE_URL: https://sandbox.mvola.mg
      MVOLA_API_KEY: PLACEHOLDER_MVOLA_SANDBOX
      ORANGE_MONEY_BASE_URL: https://api.sandbox.orange.mg
      ORANGE_MONEY_API_KEY: PLACEHOLDER_ORANGE_MONEY_SANDBOX
      SILENCE_START_HOUR: "21"
      SILENCE_END_HOUR: "6"
    ports:
      - "4000:4000"
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
