openapi: 3.1.0
info:
  title: InsTRAM API
  version: 1.0.0
  description: |
    Contrat API InsTRAM — plateforme de réservation de transport terrestre pour Madagascar.
    Toutes les routes sont préfixées `/v1/` pour préserver la compatibilité future
    (V2 pourra ajouter GPS temps réel, abonnements voyageur, API tierces sans casser V1).

    Règles de gestion critiques imposées par le cahier des charges :
      - Zéro double réservation : la sélection d'un siège émet un hold court, la vente est atomique côté DB.
      - Aucun endpoint d'annulation ni de remboursement côté voyageur : annulation strictement physique via `/v1/coop/bookings/{id}/cancel-at-counter`.
      - Walk-in gratuit : `POST /v1/coop/bookings/walk-in` ne facture ni frais voyageur ni commission plateforme.
      - Souveraineté coopérative : les endpoints tarifs / horaires n'appliquent aucune validation côté InsTRAM.
      - Bilinguisme FR/MG : les endpoints acceptent `Accept-Language` (fr / mg) et retournent le contenu localisé.
      - Public 3G lente : réponses paginées, compression obligatoire côté serveur, projections légères.
  contact:
    name: CODEL Technologies Co. — Projet InsTRAM
    email: contact@codel.mg
  license:
    name: Propriétaire — Usage interne

servers:
  - url: https://api.instram.mg/v1
    description: Production
  - url: https://staging.api.instram.mg/v1
    description: Staging
  - url: http://localhost:4000/v1
    description: Développement local

tags:
  - name: Auth
    description: Authentification, refresh, invitations
  - name: Users
    description: Profil utilisateur, suppression compte (RGPD-like)
  - name: Catalog
    description: Villes, catalogue public
  - name: Search
    description: Recherche de trajets voyageur
  - name: Traveler-Trips
    description: Consultation détaillée d'un trajet et de ses sièges
  - name: Traveler-Bookings
    description: Réservation voyageur, paiement Mobile Money, historique, billet, notation
  - name: Cooperative
    description: Back-office coopérative (routes, véhicules, sièges, horaires, tarifs, membres, exports)
  - name: Cooperative-Bookings
    description: Suivi et walk-in coopérative
  - name: Driver
    description: Application conducteur (manifeste, embarquement, absents, départ)
  - name: Admin
    description: Console d'administration InsTRAM
  - name: Directory
    description: Annuaire public des coopératives
  - name: Notifications
    description: Templates, préférences, historique
  - name: Payments-Webhooks
    description: Webhooks entrants Mobile Money
  - name: Exports
    description: Génération et téléchargement d'exports
  - name: Realtime
    description: Documentation des canaux WebSocket (non REST)

security:
  - bearerAuth: []

paths:
  # =====================================================================
  # AUTH
  # =====================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte voyageur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé, tokens émis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email ou téléphone déjà utilisé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion (voyageur, coopérative, conducteur, admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir les tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Nouveaux tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion (révoque le refresh token courant)
      responses:
        '204': { description: Déconnecté }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/invitations/{token}/accept:
    post:
      tags: [Auth]
      summary: Accepter une invitation (membre coopérative, admin InsTRAM)
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 10 }
                firstName: { type: string }
                lastName: { type: string }
      responses:
        '200':
          description: Invitation acceptée, session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Invitation déjà acceptée / révoquée }

  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Demander une réinitialisation de mot de passe
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        '204': { description: Instructions envoyées si compte existant }

  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Réinitialiser le mot de passe via jeton
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 10 }
      responses:
        '204': { description: Mot de passe mis à jour }
        '400': { $ref: '#/components/responses/BadRequest' }

  # =====================================================================
  # USERS
  # =====================================================================
  /me:
    get:
      tags: [Users]
      summary: Récupérer le profil courant
      responses:
        '200':
          description: Profil courant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Users]
      summary: Mettre à jour son profil ou sa langue préférée
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Users]
      summary: Supprimer son compte (déclenche anonymisation immédiate)
      description: |
        Anonymisation immédiate des données personnelles.
        Les données financières et d'audit restent conservées (règle CDC §7).
      responses:
        '204': { description: Compte marqué pour suppression, sessions révoquées }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # =====================================================================
  # CATALOG
  # =====================================================================
  /catalog/cities:
    get:
      tags: [Catalog]
      summary: Lister les villes / districts du catalogue national
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Recherche par nom (FR ou MG)
        - in: query
          name: region
          schema: { type: string }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Liste paginée des villes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityList'
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=3600' }

  # =====================================================================
  # SEARCH VOYAGEUR
  # =====================================================================
  /search/trips:
    get:
      tags: [Search]
      summary: Rechercher des trajets voyageur
      description: |
        Recherche cachée 60 s côté serveur (Redis). Réponse projetée légère (< 20 kB gzip pour 20 résultats).
      security: []
      parameters:
        - in: query
          name: originCityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: destinationCityId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: passengers
          schema: { type: integer, minimum: 1, maximum: 20, default: 1 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 50 }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Résultats de recherche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # =====================================================================
  # TRAVELER — TRIP DETAILS
  # =====================================================================
  /trips/{tripInstanceId}:
    get:
      tags: [Traveler-Trips]
      summary: Détail d'un trajet (route, coopérative, politique, tarifs par catégorie)
      security: []
      parameters:
        - $ref: '#/components/parameters/TripInstanceId'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Détail du trajet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripInstanceDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripInstanceId}/seats:
    get:
      tags: [Traveler-Trips]
      summary: Carte des sièges — état temps réel
      description: |
        Ne pas polluer avec du polling. Après le premier GET, le client s'abonne
        au canal WebSocket `trip:{tripInstanceId}` pour recevoir les changements.
      security: []
      parameters:
        - $ref: '#/components/parameters/TripInstanceId'
      responses:
        '200':
          description: Plan des sièges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSeatMap' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trips/{tripInstanceId}/seats/hold:
    post:
      tags: [Traveler-Trips]
      summary: Poser un hold sur un ou plusieurs sièges (2 minutes)
      description: |
        Zéro double réservation : traité en transaction PG avec `SELECT ... FOR UPDATE`
        + contrainte unique partielle `uniq_active_seat_hold`. En cas de course,
        retourne 409 SEAT_UNAVAILABLE avec la liste des sièges rejetés.
      parameters:
        - $ref: '#/components/parameters/TripInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatDefinitionIds]
              properties:
                seatDefinitionIds:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 20
      responses:
        '201':
          description: Hold posé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatHoldResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Un ou plusieurs sièges indisponibles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatConflictResponse' }

  /trips/{tripInstanceId}/seats/hold/{holdId}:
    delete:
      tags: [Traveler-Trips]
      summary: Libérer un hold volontairement (annulation avant paiement uniquement)
      parameters:
        - $ref: '#/components/parameters/TripInstanceId'
        - in: path
          name: holdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Hold libéré }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # TRAVELER — BOOKINGS
  # =====================================================================
  /bookings:
    post:
      tags: [Traveler-Bookings]
      summary: Créer une réservation en ligne (à partir d'un hold)
      description: |
        Crée un `Booking` en `PENDING_PAYMENT`. Étape suivante : `POST /payments`.
        Aucune annulation via cette API (règle CDC §7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
      responses:
        '201':
          description: Booking en attente de paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Hold expiré ou siège volé entre-temps
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      tags: [Traveler-Bookings]
      summary: Historique des réservations du voyageur
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Historique paginé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /bookings/{bookingId}:
    get:
      tags: [Traveler-Bookings]
      summary: Détail d'une réservation (billet numérique inclus)
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail booking + billet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/ticket:
    get:
      tags: [Traveler-Bookings]
      summary: Récupérer le billet (QR + référence courte)
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Billet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
            image/png:
              schema:
                type: string
                format: binary
                description: QR code en PNG si Accept:image/png
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/resend-ticket:
    post:
      tags: [Traveler-Bookings]
      summary: Renvoyer le billet par SMS
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Renvoi programmé (immédiat, transactionnel) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/rating:
    post:
      tags: [Traveler-Bookings]
      summary: Noter la coopérative après un voyage terminé
      description: |
        Autorisé uniquement si `Booking.status = COMPLETED` (RG-11).
        Une note unique par voyage (RG-12).
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RatingRequest' }
      responses:
        '201':
          description: Note enregistrée (en attente modération)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Voyage pas encore terminé
        '409':
          description: Déjà noté

  # =====================================================================
  # PAYMENTS
  # =====================================================================
  /payments:
    post:
      tags: [Traveler-Bookings]
      summary: Initier le paiement Mobile Money d'une réservation en attente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiatePaymentRequest' }
      responses:
        '201':
          description: Paiement initié, instructions renvoyées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentInitiation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Booking déjà payé ou expiré

  /payments/{paymentId}:
    get:
      tags: [Traveler-Bookings]
      summary: Statut d'un paiement
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Statut du paiement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/mobile-money/{provider}:
    post:
      tags: [Payments-Webhooks]
      summary: Webhook entrant Mobile Money (MVola, Orange Money, Airtel V2)
      description: |
        Signature vérifiée obligatoirement. Idempotence par `providerTransactionId`.
      security: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [mvola, orange-money, airtel-money] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Traité }
        '400': { description: Payload invalide }
        '401': { description: Signature invalide }
        '409': { description: Duplication ignorée }

  # =====================================================================
  # COOPÉRATIVE — BACK-OFFICE
  # =====================================================================
  /coop/cooperatives/current:
    get:
      tags: [Cooperative]
      summary: Coopérative de l'utilisateur connecté
      responses:
        '200':
          description: Détail coopérative
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cooperative' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Cooperative]
      summary: Mettre à jour les infos coopérative (nom, logo, description, contact)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CooperativeUpdate' }
      responses:
        '200':
          description: Coopérative mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cooperative' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /coop/policies:
    get:
      tags: [Cooperative]
      summary: Politique d'annulation active
      responses:
        '200':
          description: Politique
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
    post:
      tags: [Cooperative]
      summary: Publier une nouvelle version de la politique d'annulation (bilingue)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRequest' }
      responses:
        '201':
          description: Politique publiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /coop/members:
    get:
      tags: [Cooperative]
      summary: Lister les membres (admin, assistants, conducteurs, contrôleurs)
      responses:
        '200':
          description: Liste des membres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cooperative]
      summary: Inviter un nouveau membre (par email ou téléphone)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationRequest' }
      responses:
        '201':
          description: Invitation envoyée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Membre déjà présent }

  /coop/members/{memberId}:
    patch:
      tags: [Cooperative]
      summary: Modifier le rôle ou l'état d'un membre
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/CooperativeRole' }
                active: { type: boolean }
      responses:
        '200':
          description: Membre mis à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Cooperative]
      summary: Retirer un membre
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Membre retiré }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /coop/vehicles:
    get:
      tags: [Cooperative]
      summary: Lister les véhicules de la coopérative
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Vehicle' }
    post:
      tags: [Cooperative]
      summary: Ajouter un véhicule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        '201':
          description: Véhicule créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Immatriculation déjà utilisée }

  /coop/vehicles/{vehicleId}:
    get:
      tags: [Cooperative]
      summary: Détail d'un véhicule
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
