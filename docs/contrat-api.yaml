          name: limit
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingList' }

  /coop/bookings/{bookingId}:
    get:
      tags: [Cooperative-Bookings]
      summary: Détail d'une réservation (vue coop)
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /coop/bookings/walk-in:
    post:
      tags: [Cooperative-Bookings]
      summary: Créer une réservation walk-in (guichet)
      description: |
        Réservation faite par le personnel coopérative. GRATUITE, sans exception (RG-02) :
        `platformFeeMga = 0`, `commissionMga = 0`. Paiement `CASH`, `MVOLA` ou `ORANGE_MONEY`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkInBookingRequest' }
      responses:
        '201':
          description: Réservation confirmée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Siège déjà pris
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatConflictResponse' }

  /coop/bookings/{bookingId}/cancel-at-counter:
    post:
      tags: [Cooperative-Bookings]
      summary: Annuler une réservation au guichet (processus physique)
      description: |
        Seul point d'annulation autorisé. Nécessite un motif et un membre coop (RG-03).
        Un remboursement éventuel est traqué séparément (`Payment.status = REFUNDED_AT_COUNTER`)
        mais il n'y a AUCUN mouvement d'argent automatique côté plateforme.
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                refundedAtCounter: { type: boolean, default: false }
      responses:
        '200':
          description: Réservation annulée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Booking déjà annulé ou terminé }

