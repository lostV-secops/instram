            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rating' }

  /admin/ratings/{ratingId}:
    patch:
      tags: [Admin]
      summary: Publier ou rejeter un avis
      parameters:
        - in: path
          name: ratingId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RatingStatus' }
                moderationNote: { type: string }
      responses:
        '200': { description: Modéré, content: { application/json: { schema: { $ref: '#/components/schemas/Rating' } } } }

  /admin/payments:
    get:
      tags: [Admin]
      summary: Superviser les paiements (recherche, statut, litiges)
      parameters:
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - in: query
          name: provider
          schema: { $ref: '#/components/schemas/PaymentProvider' }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Supervision globale (volumes, revenus plateforme, incidents)
      responses:
        '200':
          description: KPIs plateforme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Consultation du journal d'audit
      parameters:
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: entityType
          schema: { type: string }
        - in: query
          name: actorUserId
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditLogEntry' }

  # =====================================================================
  # DIRECTORY — ANNUAIRE PUBLIC
  # =====================================================================
  /directory/cooperatives:
    get:
      tags: [Directory]
      summary: Annuaire public des coopératives
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DirectoryEntry' }
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=300' }

  /directory/cooperatives/{slug}:
    get:
      tags: [Directory]
      summary: Fiche publique d'une coopérative
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Fiche
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryEntryDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # =====================================================================
  # NOTIFICATIONS
  # =====================================================================
  /notifications:
    get:
      tags: [Notifications]
      summary: Historique de mes notifications
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }

  /notifications/preferences:
    get:
      tags: [Notifications]
      summary: Récupérer mes préférences de notifications
      responses:
        '200':
          description: Préférences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Notifications]
      summary: Mettre à jour mes préférences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200': { description: Préférences mises à jour, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }

  /admin/notifications/templates:
    get:
      tags: [Admin]
      summary: Lister les templates de notifications (bilingues)
      responses:
        '200':
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationTemplate' }
    post:
      tags: [Admin]
      summary: Créer un template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateRequest' }
      responses:
        '201': { description: Créé, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplate' } } } }

  /admin/notifications/templates/{templateId}:
    patch:
      tags: [Admin]
      summary: Modifier un template
      parameters:
        - in: path
          name: templateId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateRequest' }
      responses:
        '200': { description: Mis à jour, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplate' } } } }

  # =====================================================================
  # SANTÉ ET REALTIME
  # =====================================================================
  /healthz:
    get:
      tags: [Realtime]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: OK }

  /readyz:
    get:
      tags: [Realtime]
      summary: Readiness probe (DB + Redis + workers)
      security: []
      responses:
        '200': { description: OK }
        '503': { description: Service non prêt }

  /realtime/ws-endpoint:
    get:
      tags: [Realtime]
      summary: Renvoie l'URL WSS et le ticket court d'authentification WebSocket
      description: |
        Documentation des canaux WebSocket exposés (les canaux eux-mêmes ne sont pas REST) :
          - `trip:{tripInstanceId}` : events SEAT_HELD, SEAT_SOLD, SEAT_RELEASED
          - `booking:{userId}` : PAYMENT_CONFIRMED, PAYMENT_FAILED, BOOKING_CANCELLED
          - `cooperative:{cooperativeId}` : dashboard temps réel
          - `driver:{tripInstanceId}` : embarquement, départ
      responses:
        '200':
          description: URL WSS + ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  wsUrl: { type: string, format: uri }
                  ticket: { type: string, description: JWT court (60 s) à passer en query string }

# =====================================================================
# COMPONENTS
# =====================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AcceptLanguage:
      in: header
      name: Accept-Language
      schema: { type: string, enum: [fr, mg], default: fr }
    TripInstanceId:
      in: path
      name: tripInstanceId
      required: true
      schema: { type: string, format: uuid }
    VehicleId:
      in: path
      name: vehicleId
      required: true
      schema: { type: string, format: uuid }
    RouteId:
      in: path
      name: routeId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Permissions insuffisantes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Ressource inconnue
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Erreur serveur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # -------------------- Communs
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: SEAT_UNAVAILABLE }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    Lang:
      type: string
      enum: [fr, mg]

    Money:
      type: object
      properties:
        amount: { type: integer, description: Montant en Ariary (MGA), entier }
        currency: { type: string, enum: [MGA], default: MGA }

    # -------------------- Auth
    RegisterRequest:
      type: object
      required: [password, firstName, lastName]
      properties:
        email: { type: string, format: email }
        phone: { type: string, description: Format international, ex. +2613xxxxxxxx }
        password: { type: string, format: password, minLength: 10 }
        firstName: { type: string }
        lastName: { type: string }
        preferredLang: { $ref: '#/components/schemas/Lang' }

    LoginRequest:
      type: object
      required: [password]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        password: { type: string, format: password }

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Secondes }
        user: { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        preferredLang: { $ref: '#/components/schemas/Lang' }
        roles:
          type: array
          items: { type: string, description: Ex. TRAVELER, COOP_ADMIN, ADMIN_SUPER }
        cooperatives:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
              role: { $ref: '#/components/schemas/CooperativeRole' }
        traveler:
          type: object
          nullable: true
          properties:
            firstName: { type: string }
            lastName: { type: string }
            mobileMoneyPhone: { type: string, nullable: true }

    UpdateMeRequest:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        preferredLang: { $ref: '#/components/schemas/Lang' }
        mobileMoneyPhone: { type: string }
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 10 }

    # -------------------- Catalog
    City:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string, description: Localisé selon Accept-Language }
        district: { type: string }
        region: { type: string }

    CityList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/City' }
        nextCursor: { type: string, nullable: true }

    # -------------------- Search
    TripSearchResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripSearchResult' }
        nextCursor: { type: string, nullable: true }

    TripSearchResult:
      type: object
      properties:
        tripInstanceId: { type: string, format: uuid }
        cooperative:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
            ratingAverage: { type: number, format: float }
            ratingCount: { type: integer }
        route:
          type: object
          properties:
            originCity: { $ref: '#/components/schemas/City' }
            destinationCity: { $ref: '#/components/schemas/City' }
            estimatedDurationMin: { type: integer }
        departureAt: { type: string, format: date-time }
        arrivalEstimatedAt: { type: string, format: date-time, nullable: true }
        fareMinMga: { type: integer }
        fareMaxMga: { type: integer }
        seatsAvailable: { type: integer }
        vehicle:
          type: object
          properties:
            model: { type: string, nullable: true }
            capacity: { type: integer }

    # -------------------- Trip / Seats
    TripInstanceDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        cooperative: { $ref: '#/components/schemas/Cooperative' }
        route: { $ref: '#/components/schemas/Route' }
        vehicle: { $ref: '#/components/schemas/Vehicle' }
        departureAt: { type: string, format: date-time }
        arrivalEstimatedAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/TripStatus' }
        policy: { $ref: '#/components/schemas/Policy' }
        fares:
          type: array
          items: { $ref: '#/components/schemas/Fare' }

    TripInstanceCoopDetail:
      allOf:
        - $ref: '#/components/schemas/TripInstanceDetail'
        - type: object
          properties:
            stats:
              type: object
              properties:
                seatsSold: { type: integer }
                seatsHeld: { type: integer }
                revenueMga: { type: integer }

    TripSeatMap:
      type: object
      properties:
        tripInstanceId: { type: string, format: uuid }
        layout: { type: object, description: Schéma géométrique JSON }
        seats:
          type: array
          items:
            type: object
            properties:
              seatDefinitionId: { type: string, format: uuid }
              code: { type: string }
              category: { $ref: '#/components/schemas/SeatCategory' }
              row: { type: integer, nullable: true }
              column: { type: integer, nullable: true }
              status:
                type: string
                enum: [AVAILABLE, HELD, SOLD]
              priceMga: { type: integer }

    SeatHoldResponse:
      type: object
      properties:
        holdId: { type: string, format: uuid }
        tripInstanceId: { type: string, format: uuid }
        seats:
          type: array
          items:
            type: object
            properties:
              seatDefinitionId: { type: string, format: uuid }
              code: { type: string }
              priceMga: { type: integer }
        expiresAt: { type: string, format: date-time }

    SeatConflictResponse:
      type: object
      properties:
        code: { type: string, enum: [SEAT_UNAVAILABLE] }
        message: { type: string }
        conflictingSeats:
          type: array
          items:
            type: object
            properties:
              seatDefinitionId: { type: string, format: uuid }
              code: { type: string }
              status:
                type: string
                enum: [HELD, SOLD]

    # -------------------- Bookings
    BookingChannel:
      type: string
      enum: [ONLINE, WALK_IN]

    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, PAYMENT_EXPIRED, PAYMENT_FAILED, CANCELLED_AT_COUNTER, COMPLETED, NO_SHOW]

    BoardingStatus:
      type: string
      enum: [NOT_BOARDED, BOARDED, ABSENT]

    CreateBookingRequest:
      type: object
      required: [holdId, passengers]
      properties:
        holdId: { type: string, format: uuid }
        passengers:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PassengerRequest' }
        contactPhone: { type: string }
        preferredLang: { $ref: '#/components/schemas/Lang' }

    PassengerRequest:
      type: object
      required: [firstName, lastName, seatCode]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        nationalIdRef: { type: string }
        seatCode: { type: string }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        channel: { $ref: '#/components/schemas/BookingChannel' }
        totalAmountMga: { type: integer }
        seatSubtotalMga: { type: integer }
        platformFeeMga: { type: integer, description: "0 pour WALK_IN (RG-02)" }
        tripInstanceId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }

    BookingList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        nextCursor: { type: string, nullable: true }

    BookingDetail:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            trip: { $ref: '#/components/schemas/TripInstanceDetail' }
            passengers:
              type: array
              items:
                type: object
                properties:
                  firstName: { type: string }
                  lastName: { type: string }
                  seatCode: { type: string }
                  boardingStatus: { $ref: '#/components/schemas/BoardingStatus' }
            payments:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
            ticket: { $ref: '#/components/schemas/Ticket' }

    WalkInBookingRequest:
      type: object
      required: [tripInstanceId, seatDefinitionIds, passengers, paymentMethod]
      properties:
        tripInstanceId: { type: string, format: uuid }
        seatDefinitionIds:
          type: array
          items: { type: string, format: uuid }
          minItems: 1
        passengers:
          type: array
          items: { $ref: '#/components/schemas/PassengerRequest' }
        paymentMethod:
          type: string
          enum: [CASH, MVOLA, ORANGE_MONEY]
        buyerPhone: { type: string, description: Pour envoi SMS billet (optionnel) }
        buyerLang: { $ref: '#/components/schemas/Lang' }

    # -------------------- Ticket
    Ticket:
      type: object
      properties:
        reference: { type: string }
        qrPayload: { type: string, description: JSON signé HMAC }
        qrImageUrl: { type: string, format: uri }
        issuedAt: { type: string, format: date-time }

    # -------------------- Payments
    PaymentProvider:
      type: string
      enum: [MVOLA, ORANGE_MONEY, AIRTEL_MONEY, CASH]

    PaymentStatus:
      type: string
      enum: [INITIATED, PENDING, CONFIRMED, FAILED, EXPIRED, REFUNDED_AT_COUNTER]

    InitiatePaymentRequest:
      type: object
      required: [bookingId, provider, payerPhone]
      properties:
        bookingId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/PaymentProvider' }
        payerPhone: { type: string }

    PaymentInitiation:
      type: object
      properties:
        paymentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        instructions:
          type: object
          properties:
            messageFr: { type: string }
            messageMg: { type: string }
            ussdCode: { type: string, nullable: true }
            expiresAt: { type: string, format: date-time }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/PaymentProvider' }
        amountMga: { type: integer }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        providerTransactionId: { type: string, nullable: true }
        initiatedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }

    # -------------------- Cooperative
    CooperativeStatus:
      type: string
      enum: [PENDING_VALIDATION, VALIDATED, SUSPENDED, REJECTED]

    Cooperative:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        legalName: { type: string }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/CooperativeStatus' }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        description: { type: string, nullable: true, description: Localisé Accept-Language }
        ratingAverage: { type: number, format: float }
        ratingCount: { type: integer }

    CooperativeUpdate:
      type: object
      properties:
        displayName: { type: string }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        logoUrl: { type: string, format: uri }
        descriptionFr: { type: string }
        descriptionMg: { type: string }
        websiteUrl: { type: string, format: uri }

    Policy:
      type: object
      properties:
        id: { type: string, format: uuid }
        titleFr: { type: string }
        titleMg: { type: string }
        bodyFr: { type: string }
        bodyMg: { type: string }
        version: { type: integer }
        isActive: { type: boolean }

    PolicyRequest:
      type: object
      required: [titleFr, titleMg, bodyFr, bodyMg]
      properties:
        titleFr: { type: string }
        titleMg: { type: string }
        bodyFr: { type: string }
        bodyMg: { type: string }

    CooperativeRole:
      type: string
      enum: [COOP_ADMIN, COOP_ASSISTANT, COOP_DRIVER, COOP_CONTROLLER]

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            firstName: { type: string, nullable: true }
            lastName: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/CooperativeRole' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    InvitationRequest:
      type: object
      required: [role]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        role: { $ref: '#/components/schemas/CooperativeRole' }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/CooperativeRole' }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [PENDING, ACCEPTED, REVOKED, EXPIRED] }
        expiresAt: { type: string, format: date-time }

    # -------------------- Vehicles / SeatMaps
    Vehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        cooperativeId: { type: string, format: uuid }
        seatMapId: { type: string, format: uuid }
        registration: { type: string }
        displayName: { type: string }
        model: { type: string, nullable: true }
        capacity: { type: integer }
        isActive: { type: boolean }

    VehicleRequest:
      type: object
      required: [seatMapId, registration, displayName, capacity]
      properties:
        seatMapId: { type: string, format: uuid }
        registration: { type: string }
        displayName: { type: string }
        model: { type: string }
        capacity: { type: integer }

    SeatCategory:
      type: string
      enum: [VIP, PREMIUM, CLASSIC, STANDARD]

    SeatMap:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        layout: { type: object, description: Schéma géométrique }
        seats:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              category: { $ref: '#/components/schemas/SeatCategory' }
              row: { type: integer, nullable: true }
              column: { type: integer, nullable: true }

    SeatMapRequest:
      type: object
      required: [name, capacity, layout, seats]
      properties:
        name: { type: string }
        capacity: { type: integer }
        layout: { type: object }
        seats:
          type: array
          items:
            type: object
            required: [code, category]
            properties:
              code: { type: string }
              category: { $ref: '#/components/schemas/SeatCategory' }
              row: { type: integer }
              column: { type: integer }

    # -------------------- Routes / Schedules / Trips
    Route:
      type: object
      properties:
        id: { type: string, format: uuid }
        cooperativeId: { type: string, format: uuid }
        displayName: { type: string }
        originCity: { $ref: '#/components/schemas/City' }
        destinationCity: { $ref: '#/components/schemas/City' }
        distanceKm: { type: integer, nullable: true }
        estimatedDurationMin: { type: integer, nullable: true }
        stops:
          type: array
          items:
            type: object
            properties:
              cityId: { type: string, format: uuid }
              orderIndex: { type: integer }
              offsetMin: { type: integer }
        isActive: { type: boolean }

    RouteRequest:
      type: object
      required: [displayName, originCityId, destinationCityId]
      properties:
        displayName: { type: string }
        originCityId: { type: string, format: uuid }
        destinationCityId: { type: string, format: uuid }
        distanceKm: { type: integer }
        estimatedDurationMin: { type: integer }
        stops:
          type: array
          items:
            type: object
            required: [cityId, orderIndex, offsetMin]
            properties:
              cityId: { type: string, format: uuid }
              orderIndex: { type: integer }
              offsetMin: { type: integer }

    Schedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        departureTime: { type: string, description: HH:mm (locale Madagascar UTC+3) }
        isActive: { type: boolean }

    ScheduleRequest:
      type: object
      required: [routeId, daysOfWeek, departureTime]
      properties:
        routeId: { type: string, format: uuid }
        daysOfWeek:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        departureTime: { type: string }

    TripStatus:
      type: string
      enum: [DRAFT, OPEN_FOR_BOOKING, CLOSED_FOR_BOOKING, DEPARTED, COMPLETED, CANCELLED]

    TripInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        cooperativeId: { type: string, format: uuid }
        routeId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid, nullable: true }
        vehicleId: { type: string, format: uuid }
        departureAt: { type: string, format: date-time }
        arrivalEstimatedAt: { type: string, format: date-time, nullable: true }
        status: { $ref: '#/components/schemas/TripStatus' }
        openedForBookingAt: { type: string, format: date-time, nullable: true }

    TripInstanceRequest:
      type: object
      required: [routeId, vehicleId, departureAt]
      properties:
        routeId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        departureAt: { type: string, format: date-time }
        arrivalEstimatedAt: { type: string, format: date-time }
        notesFr: { type: string }
        notesMg: { type: string }

    TripInstanceList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TripInstance' }
        nextCursor: { type: string, nullable: true }

    Fare:
      type: object
      properties:
        id: { type: string, format: uuid }
        tripInstanceId: { type: string, format: uuid }
        seatDefinitionId: { type: string, format: uuid, nullable: true }
        category: { $ref: '#/components/schemas/SeatCategory', nullable: true }
        priceMga: { type: integer }

    FareRequest:
      type: object
      required: [priceMga]
      properties:
        seatDefinitionId: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/SeatCategory' }
        priceMga: { type: integer }

    # -------------------- Dashboard coop / admin
    CooperativeDashboard:
      type: object
      properties:
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        bookingsOnline: { type: integer }
        bookingsWalkIn: { type: integer }
        revenueGrossMga: { type: integer }
        revenueNetMga: { type: integer, description: Après commission plateforme }
        occupancyRate: { type: number, format: float, description: 0..1 }
        upcomingTrips: { type: integer }

    AdminDashboard:
      type: object
      properties:
        cooperativesActive: { type: integer }
        cooperativesPending: { type: integer }
        bookingsToday: { type: integer }
        revenueToday: { type: integer }
        platformFeeToday: { type: integer }
        incidents:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              severity: { type: string }
              message: { type: string }

    AdminUserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, SUSPENDED, DELETED] }
        roles:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    # -------------------- Pricing plans / abonnements
    PricingPlanType:
      type: string
      enum: [COMMISSION, SUBSCRIPTION]

    PricingPlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/PricingPlanType' }
        commissionRate: { type: number, format: float, nullable: true }
        monthlyFeeMga: { type: integer, nullable: true }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time, nullable: true }

    PricingPlanRequest:
      type: object
      required: [type, effectiveFrom]
      properties:
        type: { $ref: '#/components/schemas/PricingPlanType' }
        commissionRate: { type: number, format: float }
        monthlyFeeMga: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        effectiveUntil: { type: string, format: date-time }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountMga: { type: integer }
        status: { type: string, enum: [MANUAL, AUTO_BILLED, PAID, LATE, UNPAID] }
        paidAt: { type: string, format: date-time, nullable: true }

    SubscriptionRequest:
      type: object
      required: [periodStart, periodEnd, amountMga]
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amountMga: { type: integer }
        status: { type: string, enum: [MANUAL, PAID, LATE, UNPAID] }

    # -------------------- Ratings
    RatingStatus:
      type: string
      enum: [PENDING_REVIEW, PUBLISHED, REJECTED]

    RatingRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        commentFr: { type: string }
        commentMg: { type: string }

    Rating:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        cooperativeId: { type: string, format: uuid }
        score: { type: integer }
        comment: { type: string, nullable: true, description: Localisé Accept-Language }
        status: { $ref: '#/components/schemas/RatingStatus' }
        createdAt: { type: string, format: date-time }

    # -------------------- Directory
    DirectoryEntry:
      type: object
      properties:
        slug: { type: string }
        displayName: { type: string }
        description: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        regionsServed:
          type: array
          items: { type: string }
        ratingAverage: { type: number, format: float }
        ratingCount: { type: integer }

    DirectoryEntryDetail:
      allOf:
        - $ref: '#/components/schemas/DirectoryEntry'
        - type: object
          properties:
            routes:
              type: array
              items:
                type: object
                properties:
                  displayName: { type: string }
                  originCity: { $ref: '#/components/schemas/City' }
                  destinationCity: { $ref: '#/components/schemas/City' }
            policy: { $ref: '#/components/schemas/Policy' }
            contactEmail: { type: string, nullable: true }
            contactPhone: { type: string, nullable: true }

    # -------------------- Driver
    DriverTripSummary:
      type: object
      properties:
        tripInstanceId: { type: string, format: uuid }
        route:
          type: object
          properties:
            originName: { type: string }
            destinationName: { type: string }
        departureAt: { type: string, format: date-time }
        vehicleRegistration: { type: string }
        passengersCount: { type: integer }
        boardedCount: { type: integer }

    Manifest:
      type: object
      properties:
        tripInstanceId: { type: string, format: uuid }
        departureAt: { type: string, format: date-time }
        passengers:
          type: array
          items:
            type: object
            properties:
              bookingId: { type: string, format: uuid }
              bookingReference: { type: string }
              firstName: { type: string }
              lastName: { type: string }
              seatCode: { type: string }
              phone: { type: string, nullable: true }
              boardingStatus: { $ref: '#/components/schemas/BoardingStatus' }
              channel: { $ref: '#/components/schemas/BookingChannel' }

    BoardingRequest:
      type: object
      properties:
        qrPayload: { type: string, description: Payload signé scanné }
        bookingReference: { type: string, description: Saisie manuelle fallback }
      description: Un des deux champs est requis.

    BoardingEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        tripInstanceId: { type: string, format: uuid }
        method: { type: string, enum: [SCAN, MANUAL_REF] }
        boardedAt: { type: string, format: date-time }

    AbsenceEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        tripInstanceId: { type: string, format: uuid }
        reason: { type: string, nullable: true }
        markedAt: { type: string, format: date-time }

    # -------------------- Exports
    ExportType:
      type: string
      enum: [MANIFEST, FINANCIAL_REPORT, BOOKINGS, RATINGS]

    ExportRequest:
      type: object
      required: [type, format]
      properties:
        type: { $ref: '#/components/schemas/ExportType' }
        format: { type: string, enum: [CSV, PDF, XLSX] }
        filters:
          type: object
          properties:
            tripInstanceId: { type: string, format: uuid }
            from: { type: string, format: date }
            to: { type: string, format: date }
            status: { $ref: '#/components/schemas/BookingStatus' }

    ExportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ExportType' }
        format: { type: string }
        status: { type: string, enum: [QUEUED, RUNNING, READY, FAILED, EXPIRED] }
        resultUrl: { type: string, format: uri, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    # -------------------- Notifications
    NotificationChannel:
      type: string
      enum: [SMS, PUSH, EMAIL]

    NotificationCategory:
      type: string
      enum: [TRANSACTIONAL, REMINDER, SYSTEM]

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        lang: { $ref: '#/components/schemas/Lang' }
        toAddress: { type: string }
        body: { type: string, description: Contenu rendu (localisé) }
        status: { type: string, enum: [PENDING, SCHEDULED, SENT, FAILED, CANCELLED] }
        scheduledFor: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    NotificationPreferences:
      type: object
      properties:
        smsEnabled: { type: boolean, default: true }
        emailEnabled: { type: boolean, default: false }
        pushEnabled: { type: boolean, default: false }
        reminderEnabled: { type: boolean, default: true }
        preferredLang: { $ref: '#/components/schemas/Lang' }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        bodyFr: { type: string }
        bodyMg: { type: string }
        version: { type: integer }
        isActive: { type: boolean }

    NotificationTemplateRequest:
      type: object
      required: [code, category, bodyFr, bodyMg]
      properties:
        code: { type: string }
        category: { $ref: '#/components/schemas/NotificationCategory' }
        bodyFr: { type: string }
        bodyMg: { type: string }
        isActive: { type: boolean, default: true }

    # -------------------- Audit
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorUserId: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, nullable: true }
        ipAddress: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
