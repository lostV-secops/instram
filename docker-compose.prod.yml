# ============================================================================
# docker-compose.prod.yml — InsTRAM Production / Soutenance
#
# Utilise les images pré-buildées depuis GitHub Container Registry (GHCR).
# Les images sont construites automatiquement par .github/workflows/docker.yml
# à chaque push sur master.
#
# Prérequis sur le VPS :
#   - Docker + Docker Compose installés
#   - Fichier /opt/instram/.env rempli (voir .env.prod.example)
#   - Répertoire /backups/instram/ créé (pour les sauvegardes)
#   - Accès au GHCR : docker login ghcr.io -u <github_user> -p <PAT>
# ============================================================================

version: "3.9"

volumes:
  pgdata_prod:
  redisdata_prod:

networks:
  instram_net:
    driver: bridge

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-instram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB:-instram_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - instram_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instram}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata_prod:/data
    networks:
      - instram_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Backend Fastify ────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/lostv-secops/instram-backend:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Base de données — construite à partir des vars postgres ci-dessus
      DATABASE_URL: postgresql://${POSTGRES_USER:-instram}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-instram_prod}
      REDIS_URL:    redis://redis:6379

      # JWT
      JWT_ACCESS_SECRET:    ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:   ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN:  ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}

      PORT:     "4000"
      NODE_ENV: production

      # CORS — doit correspondre à l'URL publique du frontend
      CORS_ORIGIN:  ${CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}

      # Proxy de confiance (Nginx devant le backend)
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}

      # Email
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-stub}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      BREVO_API_KEY:  ${BREVO_API_KEY:-}
      SMTP_FROM:      ${SMTP_FROM:-InsTRAM <noreply@instram.mg>}
      SMTP_HOST:      ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}

      # SMS
      SMS_PROVIDER:   ${SMS_PROVIDER:-stub}
      ORANGE_SMS_URL: ${ORANGE_SMS_URL:-}
      ORANGE_SMS_KEY: ${ORANGE_SMS_KEY:-}
      TELMA_SMS_URL:  ${TELMA_SMS_URL:-}
      TELMA_SMS_KEY:  ${TELMA_SMS_KEY:-}

      # Plage de silence nocturne (UTC+3 Madagascar)
      SILENCE_START_HOUR: ${SILENCE_START_HOUR:-21}
      SILENCE_END_HOUR:   ${SILENCE_END_HOUR:-6}

      # QR Code billet
      QR_SECRET: ${QR_SECRET}

      # Stockage exports (local = disque VPS, s3 = AWS S3)
      STORAGE_PROVIDER:    ${STORAGE_PROVIDER:-local}
      S3_BUCKET_NAME:      ${S3_BUCKET_NAME:-instram-exports}
      AWS_REGION:          ${AWS_REGION:-eu-west-3}
      AWS_ACCESS_KEY_ID:   ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Mobile Money — MVola
      MVOLA_BASE_URL:        ${MVOLA_BASE_URL:-}
      MVOLA_CLIENT_ID:       ${MVOLA_CLIENT_ID:-}
      MVOLA_CLIENT_SECRET:   ${MVOLA_CLIENT_SECRET:-}
      MVOLA_WEBHOOK_SECRET:  ${MVOLA_WEBHOOK_SECRET:-}
      MVOLA_MERCHANT_NUMBER: ${MVOLA_MERCHANT_NUMBER:-}
      MVOLA_CALLBACK_URL:    ${MVOLA_CALLBACK_URL:-}

      # Mobile Money — Orange Money
      ORANGE_MONEY_BASE_URL:        ${ORANGE_MONEY_BASE_URL:-}
      ORANGE_MONEY_TOKEN:           ${ORANGE_MONEY_TOKEN:-}
      ORANGE_MONEY_WEBHOOK_SECRET:  ${ORANGE_MONEY_WEBHOOK_SECRET:-}
      ORANGE_MONEY_MERCHANT_KEY:    ${ORANGE_MONEY_MERCHANT_KEY:-}
      ORANGE_MONEY_NOTIF_URL:       ${ORANGE_MONEY_NOTIF_URL:-}
      ORANGE_MONEY_RETURN_URL:      ${ORANGE_MONEY_RETURN_URL:-}
      ORANGE_MONEY_CANCEL_URL:      ${ORANGE_MONEY_CANCEL_URL:-}

      # Webhook SMS IFTTT (confirmation paiement automatique)
      SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-}

    ports:
      - "4000:4000"
    networks:
      - instram_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Frontend Next.js ───────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/lostv-secops/instram-frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Interne Docker → SSR / Server Components
      BACKEND_URL: http://backend:4000

      # Publiques → navigateur du client
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL:  ${NEXT_PUBLIC_WS_URL}

      NODE_ENV: production
      PORT:     "3000"
    ports:
      - "3000:3000"
    networks:
      - instram_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
